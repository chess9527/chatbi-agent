services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DB_PATH=/app/data/ecommerce.db
      - TRACE_DIR=/app/traces
    volumes:
      - ./data:/app/data
      - ./traces:/app/traces

  ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000
    depends_on:
      - api
